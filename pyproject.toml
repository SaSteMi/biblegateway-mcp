[project]
name = "biblegateway-mcp"
version = "1.0.0"
description = "Unofficial bible passage retrieval MCP server using BibleGateway"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    {name = "SaSteMi"},
]
dependencies = [
    # Web scraping and HTTP client
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    # Logging
    "structlog>=23.0.0",
    # FastMCP and web server
    "fastmcp>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    # Caching and utilities
    "redis>=5.0.0",
    "aiocache>=0.12.0",
    "flatdict>=4.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
bg-mcp = "mcp_bible.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_bible"]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Repository = "https://github.com/SaSteMi/biblegateway-mcp"
